name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom tag to release (e.g., v0.1.151-entangled.1)'
        required: true
        type: string
      simple_release:
        description: 'Simple release: versioned x86_64 artifacts only; does not advance latest'
        required: false
        type: boolean
        default: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  # Automatic dispatches pass false. Manual simple releases remain available,
  # but the simple GoReleaser config never advances the global latest pointer.
  SIMPLE_RELEASE: ${{ inputs.simple_release }}
  CUSTOM_RELEASE_BRANCH: ${{ vars.CUSTOM_RELEASE_BRANCH || 'custom/main' }}

permissions:
  contents: write
  packages: write

concurrency:
  # Every release writes the shared GHCR :latest tag and GitHub's latest
  # Release pointer, so different versions must not publish concurrently.
  group: release-publish
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.release_state.outputs.published }}
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate tag and production ancestry
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-entangled\.[0-9]+$ ]]; then
            echo "Custom releases must use v<upstream>-entangled.<revision>" >&2
            exit 1
          fi

          git fetch origin "+refs/heads/$CUSTOM_RELEASE_BRANCH:refs/remotes/origin/$CUSTOM_RELEASE_BRANCH"
          git fetch origin --tags --force
          tag_commit=$(git rev-list -n 1 "$RELEASE_TAG")
          if ! git merge-base --is-ancestor "$tag_commit" "origin/$CUSTOM_RELEASE_BRANCH"; then
            echo "$RELEASE_TAG is not contained in $CUSTOM_RELEASE_BRANCH" >&2
            exit 1
          fi

          # A manually dispatched historical tag must never publish after a
          # newer production tag and move GHCR/GitHub latest backwards.
          latest_production_tag=$(git tag --merged "origin/$CUSTOM_RELEASE_BRANCH" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-entangled\.[0-9]+$' \
            | sort -V \
            | tail -1 || true)
          if [ -z "$latest_production_tag" ] || [ "$RELEASE_TAG" != "$latest_production_tag" ]; then
            echo "$RELEASE_TAG is not the newest production tag (newest: ${latest_production_tag:-none})" >&2
            exit 1
          fi

      - name: Skip an already published stable Release
        id: release_state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -sS -o /tmp/existing-release.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          case "$status" in
            200)
              if [ "$(jq -r '.draft or .prerelease' /tmp/existing-release.json)" = "true" ]; then
                echo "Existing Release is draft/prerelease; fix or remove it before retrying." >&2
                exit 1
              fi
              release_version=${RELEASE_TAG#v}
              archive_name="sub2api_${release_version}_linux_amd64.tar.gz"
              if ! jq -e --arg archive "$archive_name" '
                any(.assets[]?; .name == "checksums.txt" and ((.size // 0) > 0)) and
                any(.assets[]?; .name == $archive and ((.size // 0) > 0))
              ' /tmp/existing-release.json > /dev/null; then
                echo "Existing Release is incomplete; remove it and rerun this workflow." >&2
                exit 1
              fi

              if ! checksum_url=$(jq -er '
                [.assets[]? | select(.name == "checksums.txt") | .url][0] // error("checksums asset URL missing")
              ' /tmp/existing-release.json); then
                echo "Existing Release has no downloadable checksums asset." >&2
                exit 1
              fi
              if ! curl -fsSL \
                --max-filesize 4194304 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/octet-stream' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "$checksum_url" \
                -o /tmp/existing-checksums.txt; then
                echo "Failed to download checksums.txt from the existing Release." >&2
                exit 1
              fi
              if [ "$(wc -c < /tmp/existing-checksums.txt)" -gt 4194304 ]; then
                echo "Existing checksums.txt exceeds the 4 MiB safety limit." >&2
                exit 1
              fi
              expected_checksum=$(awk -v name="$archive_name" '
                $2 == name || $2 == "*" name { print $1; exit }
              ' /tmp/existing-checksums.txt)
              if ! [[ "$expected_checksum" =~ ^[A-Fa-f0-9]{64}$ ]]; then
                echo "Existing checksums.txt has no valid SHA-256 entry for $archive_name." >&2
                exit 1
              fi
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "$RELEASE_TAG is already published; duplicate build skipped."
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              cat /tmp/existing-release.json >&2
              echo "Failed to inspect existing Release (HTTP $status)" >&2
              exit 1
              ;;
          esac

  # Update VERSION file with tag version
  update-version:
    needs: [prepare]
    if: needs.prepare.outputs.published != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # A dispatch is initiated after creating a custom tag. Build every
          # artifact from that immutable tag rather than the moving default
          # branch, otherwise a later push can leak into this Release.
          ref: ${{ env.RELEASE_TAG }}

      - name: Update VERSION file
        run: |
          VERSION=${RELEASE_TAG#v}
          echo "$VERSION" > backend/cmd/server/VERSION
          echo "Updated VERSION file to: $VERSION"

      - name: Upload VERSION artifact
        uses: actions/upload-artifact@v7
        with:
          name: version-file
          path: backend/cmd/server/VERSION
          retention-days: 1

  build-frontend:
    needs: [prepare]
    if: needs.prepare.outputs.published != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Keep the frontend artifact aligned with the binary source tag.
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          retention-days: 1

  release:
    needs: [prepare, update-version, build-frontend]
    if: needs.prepare.outputs.published != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Download VERSION artifact
        uses: actions/download-artifact@v8
        with:
          name: version-file
          path: backend/cmd/server/

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/internal/web/dist/

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.5'

      # Docker setup for GoReleaser
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch tags with annotations
        run: |
          # 确保获取完整的 annotated tag 信息
          git fetch --tags --force

      - name: Get tag message
        id: tag_message
        run: |
          echo "Processing tag: $RELEASE_TAG"

          # 获取完整的 tag message（跳过第一行标题）
          TAG_MESSAGE=$(git tag -l --format='%(contents:body)' "$RELEASE_TAG")

          # 调试输出
          echo "Tag message length: ${#TAG_MESSAGE}"
          echo "Tag message preview:"
          echo "$TAG_MESSAGE" | head -10

          # 使用 EOF 分隔符处理多行内容
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$TAG_MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set lowercase owner for GHCR
        id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --skip=validate ${{ env.SIMPLE_RELEASE == 'true' && '--config=.goreleaser.simple.yaml' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'skip' }}

      # Update DockerHub description
      - name: Update DockerHub description
        if: ${{ env.SIMPLE_RELEASE != 'true' && env.DOCKERHUB_USERNAME != '' }}
        uses: peter-evans/dockerhub-description@v5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/sub2api
          short-description: "Sub2API - AI API Gateway Platform"
          readme-filepath: ./deploy/DOCKER.md

      # Send Telegram notification
      - name: Send Telegram Notification
        if: ${{ env.SIMPLE_RELEASE != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          RELEASE_NOTES: ${{ steps.tag_message.outputs.message }}
        continue-on-error: true
        run: |
          # 检查必要的环境变量
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not configured, skipping notification"
            exit 0
          fi

          TAG_NAME="$RELEASE_TAG"
          VERSION=${RELEASE_TAG#v}
          REPO="${{ github.repository }}"
          GHCR_IMAGE="ghcr.io/${REPO,,}"  # ${,,} converts to lowercase

          # 获取 tag message 内容并转义 Markdown 特殊字符
          TAG_MESSAGE="$RELEASE_NOTES"
          TAG_MESSAGE=$(echo "$TAG_MESSAGE" | sed 's/\([_*`\[]\)/\\\1/g')

          # 限制消息长度（Telegram 消息限制 4096 字符，预留空间给头尾固定内容）
          if [ ${#TAG_MESSAGE} -gt 3500 ]; then
            TAG_MESSAGE="${TAG_MESSAGE:0:3500}..."
          fi

          # 构建消息内容
          MESSAGE="🚀 *Sub2API 新版本发布！*"$'\n'$'\n'
          MESSAGE+="📦 版本号: \`${VERSION}\`"$'\n'$'\n'

          # 添加更新内容
          if [ -n "$TAG_MESSAGE" ]; then
            MESSAGE+="${TAG_MESSAGE}"$'\n'$'\n'
          fi

          MESSAGE+="🐳 *Docker 部署:*"$'\n'
          MESSAGE+="\`\`\`bash"$'\n'
          # 根据是否配置 DockerHub 动态生成
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            DOCKER_IMAGE="${DOCKERHUB_USERNAME}/sub2api"
            MESSAGE+="# Docker Hub"$'\n'
            MESSAGE+="docker pull ${DOCKER_IMAGE}:${VERSION}"$'\n'
            MESSAGE+="# GitHub Container Registry"$'\n'
          fi
          MESSAGE+="docker pull ${GHCR_IMAGE}:${VERSION}"$'\n'
          MESSAGE+="\`\`\`"$'\n'$'\n'
          MESSAGE+="🔗 *相关链接:*"$'\n'
          MESSAGE+="• [GitHub Release](https://github.com/${REPO}/releases/tag/${TAG_NAME})"$'\n'
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            MESSAGE+="• [Docker Hub](https://hub.docker.com/r/${DOCKER_IMAGE})"$'\n'
          fi
          MESSAGE+="• [GitHub Packages](https://github.com/${REPO}/pkgs/container/sub2api)"$'\n'$'\n'
          MESSAGE+="#Sub2API #Release #${TAG_NAME//./_}"

          # 发送消息
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "${TELEGRAM_CHAT_ID}" \
              --arg text "${MESSAGE}" \
              '{
                chat_id: $chat_id,
                text: $text,
                parse_mode: "Markdown",
                disable_web_page_preview: true
              }')"
